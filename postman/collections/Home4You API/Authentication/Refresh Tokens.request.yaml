$kind: http-request
description: Get a new access token using a valid refresh token.
url: "{{baseUrl}}/api/v1/auth/refresh"
method: POST
headers:
  Content-Type: application/json
  x-signature: "{{computed_sig}}"
  x-timestamp: "{{computed_ts}}"
  x-nonce: "{{computed_nonce}}"
body:
  type: text
  content: |-
    {
        "refreshToken": "{{REFRESH_TOKEN}}",
        "deviceId": "{{DEVICE_ID}}"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: >-
      const crypto = require('crypto-js');


      const secret = pm.environment.get("HMAC_SECRET_KEY");

      console.log(secret);


      const timestamp = Date.now().toString();

      const nonce = Math.random().toString(36).substring(2, 15);


      let payload = "";

      if (pm.request.method === 'GET') {
          const fullUrl = pm.request.url.toString();
          const resolvedUrl = pm.variables.replaceIn(fullUrl);
          const urlObj = new URL(resolvedUrl);
          payload = urlObj.pathname + urlObj.search;
      } else {
          const rawBody = pm.request.body.toString();
          payload = pm.variables.replaceIn(rawBody);
      }


      const message = `${timestamp}:${nonce}:${payload}`; // Make sure order is
      right

      console.log(message);


      const hash = crypto.HmacSHA256(message, secret);

      const signature = crypto.enc.Hex.stringify(hash);


      pm.variables.set("computed_sig", signature);

      pm.variables.set("computed_ts", timestamp);

      pm.variables.set("computed_nonce", nonce); ``


      console.log("Payload signed:", message);

      console.log("Signature:", signature);
    language: text/javascript
  - type: afterResponse
    code: >
      const activeEnvName = pm.environment.name;

      const TARGET_ENV_NAME = "";


      if (TARGET_ENV_NAME && activeEnvName !== TARGET_ENV_NAME) {
          console.warn(`[SKIP] Tokens were not updated. Current active environment is '${activeEnvName}', but the script is set to only run on '${TARGET_ENV_NAME}'.`);
          return;
      }


      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });


      if (pm.response.code < 200 || pm.response.code >= 300) {
          console.error(`Request failed with status: ${pm.response.code}. Skipping token update.`);
          return;
      }


      let jsonData;

      try {
          jsonData = pm.response.json();
      } catch (e) {
          pm.test("Response is valid JSON", false);
          console.error("Failed to parse JSON response:", e);
          return;
      }


      const newAccessToken = jsonData.accessToken;

      pm.environment.set("ACCESS_TOKEN", newAccessToken);

      if (pm.environment.get("ACCESS_TOKEN") === newAccessToken) {
          pm.test("successfully updated ACCESS_TOKEN", true);
      }


      const newRefreshToken = jsonData.refreshToken;

      pm.environment.set("REFRESH_TOKEN", newRefreshToken);

      if (pm.environment.get("REFRESH_TOKEN") === newRefreshToken) {
          pm.test("successfully updated REFRESH_TOKEN", true);
      }
    language: text/javascript
order: 8000
