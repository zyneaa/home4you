$kind: http-request
description: Request a password reset. An email with reset instructions will be
  sent to the provided email address.
url: "{{baseUrl}}/api/v1/password/forgot-password"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: x-signature
    value: "{{hmacSignature}}"
    description: HMAC-SHA256 signature
  - key: x-timestamp
    value: "{{hmacTimestamp}}"
    description: Unix timestamp
  - key: x-nonce
    value: "{{hmacNonce}}"
    description: Unique nonce
body:
  type: text
  content: |-
    {
      "email": "user@example.com"
    }
order: 1000
