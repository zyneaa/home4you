$kind: http-request
description: Delete a post by its ID. Users can only delete their own posts.
url: "{{baseUrl}}/api/v1/post/delete/:postId"
method: DELETE
headers:
  - key: Authorization
    value: Bearer {{accessToken}}
    description: JWT access token
  - key: x-signature
    value: "{{hmacSignature}}"
    description: HMAC-SHA256 signature
  - key: x-timestamp
    value: "{{hmacTimestamp}}"
    description: Unix timestamp
  - key: x-nonce
    value: "{{hmacNonce}}"
    description: Unique nonce
pathVariables:
  - key: postId
    value: "{{postId}}"
    description: MongoDB ObjectId of the post (24 hex characters)
order: 3000
