$kind: http-request
description: |-
  List all posts with pagination.

  **Query Parameters:**
  - `page`: Page number (default: 1)
  - `limit`: Items per page (1-100, default: 10)
  - `userId`: Optional filter to get posts by a specific user
url: "{{baseUrl}}/api/v1/post/find?page=1&limit=10"
method: GET
headers:
  - key: Authorization
    value: Bearer {{accessToken}}
    description: JWT access token
  - key: x-signature
    value: "{{hmacSignature}}"
    description: HMAC-SHA256 signature
  - key: x-timestamp
    value: "{{hmacTimestamp}}"
    description: Unix timestamp
  - key: x-nonce
    value: "{{hmacNonce}}"
    description: Unique nonce
queryParams:
  - key: page
    value: "1"
    description: "Page number (default: 1)"
  - key: limit
    value: "10"
    description: "Items per page (1-100, default: 10)"
  - key: userId
    value: ""
    disabled: true
    description: Filter posts by user ID
order: 5000
