$kind: http-request
description: Get details of a specific post by its ID.
url: "{{baseUrl}}/api/v1/post/find/:postId"
method: GET
headers:
  - key: Authorization
    value: Bearer {{accessToken}}
    description: JWT access token
  - key: x-signature
    value: "{{hmacSignature}}"
    description: HMAC-SHA256 signature
  - key: x-timestamp
    value: "{{hmacTimestamp}}"
    description: Unix timestamp
  - key: x-nonce
    value: "{{hmacNonce}}"
    description: Unique nonce
pathVariables:
  - key: postId
    value: "{{postId}}"
    description: MongoDB ObjectId of the post (24 hex characters)
order: 4000
