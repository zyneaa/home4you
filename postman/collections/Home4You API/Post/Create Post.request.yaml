$kind: http-request
description: >-
  Create a new property listing post.


  **Required fields:**

  - All property base fields (price, propertyType, transactionType,
  locationReadable, locationCoordinates, isAvailable)

  - `description`: Optional detailed description of the listing
url: "{{baseUrl}}/api/v1/post/new"
method: POST
headers:
  - key: Authorization
    value: Bearer {{accessToken}}
    description: JWT access token
  - key: Content-Type
    value: application/json
  - key: x-signature
    value: "{{hmacSignature}}"
    description: HMAC-SHA256 signature
  - key: x-timestamp
    value: "{{hmacTimestamp}}"
    description: Unix timestamp
  - key: x-nonce
    value: "{{hmacNonce}}"
    description: Unique nonce
body:
  type: text
  content: >-
    {
      "title": "Beautiful Family Home for Sale",
      "description": "Spacious 4-bedroom home in a quiet neighborhood with excellent schools nearby.",
      "price": 450000,
      "currency": "USD",
      "propertyType": "house",
      "transactionType": "sale",
      "locationReadable": "456 Oak Avenue, Los Angeles, CA",
      "locationCoordinates": {
        "type": "Point",
        "coordinates": [-118.243683, 34.052235]
      },
      "city": "Los Angeles",
      "country": "USA",
      "bedrooms": 4,
      "bathrooms": 3,
      "areaSqFt": 2500,
      "category": "residential",
      "photos": ["https://example.com/house1.jpg", "https://example.com/house2.jpg"],
      "amenities": ["garage", "backyard", "fireplace"],
      "builtYear": 2015,
      "furnished": 0,
      "isAvailable": true
    }
order: 1000
