$kind: http-request
description: Update user details. Users can only update their own profile.
url: "{{baseUrl}}/api/v1/user/:id"
method: PATCH
headers:
  - key: Authorization
    value: Bearer {{accessToken}}
    description: JWT access token
  - key: Content-Type
    value: application/json
  - key: x-signature
    value: "{{hmacSignature}}"
    description: HMAC-SHA256 signature
  - key: x-timestamp
    value: "{{hmacTimestamp}}"
    description: Unix timestamp
  - key: x-nonce
    value: "{{hmacNonce}}"
    description: Unique nonce
pathVariables:
  - key: id
    value: "{{userId}}"
    description: MongoDB ObjectId of the user
body:
  type: text
  content: |-
    {
      "name": "Updated Name"
    }
order: 2000
