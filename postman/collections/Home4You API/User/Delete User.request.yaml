$kind: http-request
description: Delete a user account. Users can only delete their own account.
url: "{{baseUrl}}/api/v1/user/:id"
method: DELETE
headers:
  - key: Authorization
    value: Bearer {{accessToken}}
    description: JWT access token
  - key: x-signature
    value: "{{hmacSignature}}"
    description: HMAC-SHA256 signature
  - key: x-timestamp
    value: "{{hmacTimestamp}}"
    description: Unix timestamp
  - key: x-nonce
    value: "{{hmacNonce}}"
    description: Unique nonce
pathVariables:
  - key: id
    value: "{{userId}}"
    description: MongoDB ObjectId of the user
order: 3000
