name: Lint & Format Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: services/core/package-lock.json

      - name: Install dependencies
        working-directory: ./services/core
        run: npm ci

      - name: Check linting
        working-directory: ./services/core
        run: npm run lint

      - name: Run Prettier format check
        working-directory: ./services/core
        run: npm run fmt:check
