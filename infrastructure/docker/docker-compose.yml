services:
  core:
    # Use image from GHCR if IMAGE_NAME is set, otherwise build locally
    # For production on EC2, set IMAGE_NAME env var to the GHCR image name
    # For local development, leave IMAGE_NAME unset to use build
    image: ${IMAGE_NAME:-home4you:local}
    build:
      context: ../../services/core
      dockerfile: ../../services/core/Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Database
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongo:27017/home4you}
      DATABASE_REPLICA_SET: ${DATABASE_REPLICA_SET:-rs0}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-10}
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-2}
      # Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Rate limiting
      GLOBAL_LIMIT: ${GLOBAL_LIMIT:-100}
      GLOBAL_WINDOW_SIZE: ${GLOBAL_WINDOW_SIZE:-15}
      GLOBAL_SUB_WINDOW_SIZE: ${GLOBAL_SUB_WINDOW_SIZE:-5}
      USER_LIMIT: ${USER_LIMIT:-100}
      USER_WINDOW_SIZE: ${USER_WINDOW_SIZE:-15}
      USER_SUB_WINDOW_SIZE: ${USER_SUB_WINDOW_SIZE:-5}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Auth
      FAILED_LOGIN_ATTEMPT: ${FAILED_LOGIN_ATTEMPT:-10}
      ACCOUNT_LOCK_DURATION: ${ACCOUNT_LOCK_DURATION:-300000}
      REFRESH_TOKEN_EXPIRY_DAYS: ${REFRESH_TOKEN_EXPIRY_DAYS:-30}
      OPT_EXPIARY: ${OPT_EXPIARY:-300000}
      OTP_RESEND_WINDOW_SECONDS: ${OTP_RESEND_WINDOW_SECONDS:-60}
      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}

      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - home4you-network
    restart: unless-stopped
  cleanup-worker:
    # Same image as core; only the entrypoint differs (background cron
    # worker instead of the HTTP API).
    image: ${IMAGE_NAME:-home4you:local}
    build:
      context: ../../services/core
      dockerfile: ../../services/core/Dockerfile
    # No ports: the worker exposes nothing.
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Database
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongo:27017/home4you}
      DATABASE_REPLICA_SET: ${DATABASE_REPLICA_SET:-rs0}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-10}
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-2}
      # Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Rate limiting (required by env validation even if unused here)
      GLOBAL_LIMIT: ${GLOBAL_LIMIT:-100}
      GLOBAL_WINDOW_SIZE: ${GLOBAL_WINDOW_SIZE:-15}
      GLOBAL_SUB_WINDOW_SIZE: ${GLOBAL_SUB_WINDOW_SIZE:-5}
      USER_LIMIT: ${USER_LIMIT:-100}
      USER_WINDOW_SIZE: ${USER_WINDOW_SIZE:-15}
      USER_SUB_WINDOW_SIZE: ${USER_SUB_WINDOW_SIZE:-5}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Auth
      FAILED_LOGIN_ATTEMPT: ${FAILED_LOGIN_ATTEMPT:-10}
      ACCOUNT_LOCK_DURATION: ${ACCOUNT_LOCK_DURATION:-300000}
      REFRESH_TOKEN_EXPIRY_DAYS: ${REFRESH_TOKEN_EXPIRY_DAYS:-30}
      OPT_EXPIARY: ${OPT_EXPIARY:-300000}
      OTP_RESEND_WINDOW_SECONDS: ${OTP_RESEND_WINDOW_SECONDS:-60}
      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}

      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY:-}

      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}

      MAX_PHOTO_SIZE: ${MAX_PHOTO_SIZE:-50000}
      MAX_PHOTO_WIDTH: ${MAX_PHOTO_WIDTH:-1080}
      MAX_PHOTO_HEIGHT: ${MAX_PHOTO_HEIGHT:-1980}
      MAX_PHOTO_FILES: ${MAX_PHOTO_FILES:-10}

      # Job tuning
      CLEANUP_CRON_SCHEDULE: ${CLEANUP_CRON_SCHEDULE:-*/15 * * * *}
      CLEANUP_GRACE_MINUTES: ${CLEANUP_GRACE_MINUTES:-30}
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - home4you-network
    restart: unless-stopped
    # Override the API entrypoint; the worker connects to the DB itself
    # before scheduling anything.
    command: ["node", "./build/jobs/worker.mjs"]

  mongo:
    image: mongo:7.0
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-home4you}
    volumes:
      - mongo-data:/data/db
    networks:
      - home4you-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    command: mongod --replSet rs0

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - home4you-network
    restart: "no"
    entrypoint: ["mongosh"]
    command:
      - "--host"
      - "mongo:27017"
      - "--eval"
      - |
        try {
          rs.status();
          print('Replica set already initialized');
        } catch (e) {
          print('Initializing replica set...');
          rs.initiate({
            _id: 'rs0',
            members: [{ _id: 0, host: 'mongo:27017' }]
          });
          print('Replica set initialized');
        }

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - home4you-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: redis-server --appendonly yes

networks:
  home4you-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
